:root{--a:#8b7cff;--rgb:139,124,255;--line:#ffffff20;--muted:#8994ab;--glass:rgba(12,17,30,.86);--shadow:0 24px 80px #0009}*{box-sizing:border-box}body{margin:0;overflow:hidden;height:100vh;background:#090d18;color:#eef1ff;font:14px Inter,system-ui}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}#desktop{position:fixed;inset:0;isolation:isolate;background:#0a1020}.wall{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 18% 20%,#35306d 0,transparent 38%),radial-gradient(ellipse at 82% 78%,#123d55 0,transparent 42%),linear-gradient(135deg,#080b16,#10182b 55%,#090d18)}.wall:before{content:"";position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:48px 48px}#top{height:34px;position:absolute;inset:0 0 auto;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:#05081266;backdrop-filter:blur(18px);font-size:11px;color:#dce2f5;border-bottom:1px solid #ffffff0b}.brand{font-weight:800;letter-spacing:2px}.brand b{color:var(--a)}.topgroup{display:flex;align-items:center;gap:15px}#icons{position:absolute;top:48px;left:18px;bottom:95px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px}.deskicon{width:82px;min-height:78px;border:1px solid transparent;background:transparent;border-radius:11px;display:flex;align-items:center;flex-direction:column;gap:6px;padding:8px 4px;font-size:11px;text-shadow:0 1px 4px #000;user-select:none}.deskicon .ico{font-size:29px}.deskicon:hover,.deskicon.sel{background:#ffffff16;border-color:#ffffff25;backdrop-filter:blur(12px)}#selectbox{position:absolute;display:none;z-index:90;border:1px solid var(--a);background:#8b7cff22;pointer-events:none}#dockwrap{position:absolute;bottom:17px;left:50%;transform:translateX(-5 adow:var(--shadow);backdrop-filter:blur(27px) saturate(1.3);overflow:hidden;transform-origin:center;animation:win-open .24s cubic-bezier(.2,.8,.2,1) both}.win.is-closing{pointer-events:none;animation:win-close .18s ease-in both}.win.is-minimizing{pointer-events:none;animation:win-minimize .22s cubic-bezier(.4,0,.8,.3) both}.win.is-restoring{animation:win-restore .24s cubic-bezier(.2,.8,.2,1) both}.win.focus{border-color:#8b7cff99;box-shadow:0 25px 80px #000a,0 0 0 1px #8b7cff22}.win.max{left:8px!important;top:42px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 122px)!important}.titlebar{height:42px;flex:none;display:flex;align-items:center;padding:0 12px;background:#ffffff06;border-bottom:1px solid #ffffff12;cursor:grab;user-select:none}.titlebar:active{cursor:grabbing}.traffic{display:flex;gap:7px;margin-right:13px}.traffic button{width:11px;height:11px;padding:0;border:0;border-radius:50%;font-size:0}.close{background:#ff625b}.min{background:#ffbd44}.max{background:#31c96b}.wtitle{font-size:12px;font-weight:600;flex:1}.win button.action{border:0;background:transparent;color:#9da6ba;padding:4px 7px}.win button.action:hover{background:#ffffff18}.wbody{flex:1;min-height:0;overflow:auto;position:relative}.resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}.pad{padding:18px}.eyebrow{font:10px 'DM Mono';letter-spacing:1.8px;color:var(--a)}.muted{color:var(--muted)}.panel{padding:14px;background:#ffffff09;border:1px solid #ffffff13;border-radius:11px}.field{width:100%;padding:10px 11px;background:#070b15;border:1px solid #ffffff22;border-radius:8px;color:#eef1ff}.btn{padding:9px 13px;border:0;border-radius:8px;background:var(--a);color:white;font-weight:600}.ghost{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#ffffff0b}.browser{height:100%;display:flex;flex-direction:column;background:#0c101b}.toolbar{display:flex;gap:7px;padding:9px;border-bottom:1px solid #ffffff15}.toolbar button{border:0;border-radius:7px;background:#ffffff0c;padding:7px 10px}.address{flex:1;min-width:40px;background:#050812;border:1px solid #ffffff20;border-radius:8px;padding:8px 10px;color:white;font-size:12px}.bbody{flex:1;min-height:0;overflow:auto}.home{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:radial-gradient(ellipse at center,#28234c77,transparent 60%)}.home h1{font-size:42px;letter-spacing:-2px;margin:8px}.home p{font-size:12px;color:var(--muted)}.searchrow{display:flex;gap:8px;width:min(500px,100%);margin:20px 0}.searchrow input{flex:1}.bnote{padding:7px 11px;font-size:10px;color:#aab4c8;border-top:1px solid #ffffff15}.terminal{height:100%;display:flex;flex-direction:column;background:#070a11;padding:14px;font:12px/1.7 'DM Mono',monospace;color:#cbd7eb}.tout{flex:1;overflow:auto;white-space:pre-wrap}.tline{display:flex;gap:8px}.tinput{flex:1;background:transparent;border:0;outline:0;color:#e5edff;font:inherit;min-width:0}.explorer{height:100%;display:flex;flex-direction:column}.exbar{padding:9px 12px;border-bottom:1px solid #ffffff15;display:flex;align-items:center;gap:8px}.files{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.file{padding:12px 5px;border:1px solid transparent;border-radius:9px;background:transparent;display:flex;align-items:center;flex-direction:column;gap:7px;font-size:11px}.file:hover{background:#ffffff12;border-color:#ffffff17}.file span{font-size:28px}.file small{color:var(--muted)}.editor{height:100%;display:flex;flex-direction:column;background:#090d16}.etool{padding:8px 11px;border-bottom:1px solid #ffffff15;display:flex;align-items:center;gap:8px}.editarea{flex:1;min-height:0;display:flex;font:12px/1.8 'DM Mono'}.linenums{padding:12px 9px;color:#59647b;text-align:right;background:#ffffff05;white-space:pre;min-width:35px}.editarea textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:#dce6f8;padding:12px;font:inherit;white-space:pre}.estatus{padding:5px 11px;border-top:1px solid #ffffff13;color:#8994ab;font:10px 'DM Mono'}.settings{height:100%;display:grid;grid-template-columns:135px 1fr}.snav{padding:12px;border-right:1px solid #ffffff15}.snav button{display:block;width:100%;padding:9px;text-align:left;background:transparent;border:0;border-radius:7px;color:#aab4c8;font-size:11px}.snav button.on,.snav button:hover{background:#ffffff15;color:white}.smain{padding:19px;overflow:auto}.swatches{display:flex;gap:9px}.swatch{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff44}.wallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wallchoice{height:58px;border:2px solid transparent;border-radius:8px}.wallchoice.on{border-color:white}.sysgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{font-size:24px;font-weight:700;margin:7px 0}.meter{height:6px;border-radius:9px;background:#ffffff18;overflow:hidden}.meter span{display:block;height:100%;background:var(--a)}.viewer{height:100%;display:grid;place-items:center;background:#070a12;padding:20px}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.toast{position:absolute;right:20px;top:48px;z-index:1500;background:#131b2c;border:1px solid var(--line);border-radius:9px;padding:11px 15px;box-shadow:var(--shadow);font-size:11px;animation:pop .2s}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes win-open{from{opacity:0;transform:translateY(18px) scale(.94);filter:blur(7px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes win-close{to{opacity:0;transform:translateY(10px) scale(.92);filter:blur(5px)}}@keyframes win-minimize{to{opacity:0;transform:translateY(38vh) scale(.12);filter:blur(4px)}}@keyframes win-restore{from{opacity:0;transform:translateY(32px) scale(.9);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@media(prefers-reduced-motion:reduce){.win,.win.is-closing,.win.is-minimizing,.win.is-restoring{animation-duration:.01ms!important}}
\n@media(max-width:650px){#icons{left:5px;top:43px}.deskicon{width:68px;min-height:68px}.win{left:3vw!important;top:7vh!important;width:94vw!important;height:78vh!important;min-width:0}.settings{grid-template-columns:100px 1fr}.smain{padding:12px}#dock{gap:4px;padding:7px}.sysgrid{grid-template-columns:1fr}}
</style></head>
<body><main id="desktop"><div class="wall" id="wall"></div><header id="top"><div class="topgroup"><span class="brand">NOVA<b>OS</b></span><button class="ghost" id="topMenu">Workspace</button><span class="muted">Desktop 01</span></div><div class="topgroup"><span id="net">◉ Connected</span><span id="clock">--:--</span></div></header>
<div id="icons"><button class="deskicon" data-app="browser"><span class="ico">🌐</span>Browser</button><button class="deskicon" data-app="explorer"><span class="ico">📁</span>Files</button><button class="deskicon" data-app="terminal"><span class="ico">⌘</span>Terminal</button><button class="deskicon" data-app="editor"><span class="ico">📝</span>Notepad</button><button class="deskicon" data-app="settings"><span class="ico">⚙️</span>Settings</button><button class="deskicon" data-app="system"><span class="ico">📊</span>System info</button></div><div id="selectbox"></div>
<div id="launcher"><b style="letter-spacing:2px">NOVA LAUNCHER</b><span class="muted" style="float:right;font-size:10px">v1.0</span><input id="launchSearch" placeholder="Search apps..."><div class="launchgrid" id="launchGrid"></div><p class="muted" style="font-size:10px;border-top:1px solid #ffffff15;padding-top:10px">Personal workspace · ● ONLINE</p></div>
<div id="dockwrap"><div id="dock"><button id="start" title="Launcher">◈</button><div class="sep"></div><div id="dockApps" style="display:flex;gap:7px"></div><div class="sep"></div><button data-app="settings" title="Settings">⚙️</button></div></div><div id="ctx"></div></main>
<script>
(function(){
const $=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));
const apps={browser:['🌐','Browser',850,570],terminal:['⌘','Terminal',620,420],explorer:['📁','File Explorer',720,490],editor:['📝','Notepad',700,500],settings:['⚙️','Settings',690,510],system:['📊','System Monitor',620,430],viewer:['🖼️','Image Viewer',650,480]};
const walls=['radial-gradient(ellipse at 18% 20%,#35306d 0,transparent 38%),radial-gradient(ellipse at 82% 78%,#123d55 0,transparent 42%),linear-gradient(135deg,#080b16,#10182b 55%,#090d18)','radial-gradient(ellipse at 20% 25%,#663d70 0,transparent 40%),radial-gradient(ellipse at 80% 70%,#a34b62 0,transparent 40%),linear-gradient(135deg,#140d20,#30172c)','radial-gradient(ellipse at 30% 25%,#155b58 0,transparent 40%),radial-gradient(ellipse at 80% 80%,#274477 0,transparent 40%),linear-gradient(135deg,#071b20,#10243a)','linear-gradient(135deg,#171b28,#30394b 50%,#111827)','radial-gradient(circle at 50% 50%,#4435a0 0,transparent 45%),linear-gradient(135deg,#080b16,#172447)','linear-gradient(135deg,#241a13,#533c25 50%,#12151b)'];
const defaults={accent:'#8b7cff',wall:0,scale:1,audio:true,proxy:'https://proxy.cors.dev/{url}'};
let cfg=Object.assign({},defaults,JSON.parse(localStorage.getItem('nova.cfg')||'{}')),wins={},z=10,active=null,started=Date.now(),folder='/root',noteName='Untitled.txt',dirty=false;
let fs=JSON.parse(localStorage.getItem('nova.fs')||'null')||{'/root':[{name:'Documents',type:'folder',icon:'📁',path:'/documents'},{name:'Pictures',type:'folder',icon:'🖼️',path:'/pictures'},{name:'welcome.txt',type:'text',icon:'📄',content:'Welcome to NOVA OS.\\n\\nYour personal web desktop is ready.\\n\\nOpen apps from the dock, double-click files to open them, and personalize your workspace in Settings.'},{name:'system.log',type:'text',icon:'📋',content:'[OK] Desktop compositor ready\\n[OK] Window manager online\\n[OK] Local storage mounted'}],'/documents':[{name:'Getting started.txt',type:'text',icon:'📄',content:'NOVA OS — Getting Started\\n\\n• Double-click desktop icons to launch.\\n• Drag windows by their title bars.\\n• Resize from the lower-right corner.\\n• Right-click the desktop for quick actions.\\n• Your notes and settings save in this browser.'},{name:'ideas.txt',type:'text',icon:'📄',content:'Ideas go here...\\n'}],'/pictures':[{name:'Aurora.jpg',type:'image',icon:'🌌',url:'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200'}]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('nova.cfg',JSON.stringify(cfg));localStorage.setItem('nova.fs',JSON.stringify(fs))}
if(cfg.proxy==='https://corsproxy.io/?'){cfg.proxy=defaults.proxy;save()}
function apply(){document.documentElement.style.setProperty('--a',cfg.accent);let h=cfg.accent.slice(1);document.documentElement.style.setProperty('--rgb',parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16));$('#wall').style.background=walls[cfg.wall]||walls[0];document.body.style.fontSize=(14*cfg.scale)+'px'}apply();
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;$('#desktop').append(d);setTimeout(()=>d.remove(),2500)}
function content(id,arg){if(id==='browser')return '<div class="browser"><div class="toolbar"><button data-nav="back">←</button><button data-nav="forward">→</button><button data-nav="reload">↻</button><input class="address" id="addr" value="nova://home" placeholder="Search or enter URL"><button class="btn" id="go">Go</button><span class="eyebrow">● PROXY</span></div><div class="bbody" id="bbody"><div class="home"><div class="eyebrow">NOVA NETWORK</div><h1>Explore<span style="color:var(--a)">.</span></h1><p>A minimal gateway to the open web.</p><div class="searchrow"><input class="field" id="bsearch" placeholder="Search the web or enter a URL"><button class="btn" id="bsearchgo">↗</button></div><div><button class="ghost quick" data-url="https://example.com">Example</button> <button class="ghost quick" data-url="https://wikipedia.org">Wikipedia</button> <button class="ghost quick" data-url="https://github.com">GitHub</button></div><p style="max-width:480px;margin-top:25px;font-size:10px">Proxy browsing is experimental. Some websites block proxy access or require browser features unavailable in a fetched preview.</p></div></div><div class="bnote" id="bnote">Ready · requests use your configured proxy.</div></div>';
if(id==='terminal')return '<div class="terminal"><div class="tout" id="tout"><span style="color:var(--a)">NOVA Terminal</span> 1.0.0<br>Type <b>help</b> to see commands.<br><br></div><div class="tline"><span style="color:var(--a)">guest@nova:~$</span><input class="tinput" id="tin" autocomplete="off" spellcheck="false"></div></div>';
if(id==='explorer')return '<div class="explorer"><div class="exbar"><button class="ghost" id="backfolder">←</button><button class="ghost" id="homefolder">⌂</button><span id="path" class="muted" style="font:11px DM Mono">/root</span><span style="flex:1"></span><button class="ghost" id="newfile">＋ New file</button></div><div class="files" id="filelist"></div></div>';
if(id==='editor')return '<div class="editor"><div class="etool"><button class="ghost" id="newnote">New</button><button class="ghost" id="savenote">Save</button><span id="notename" class="muted" style="font-size:11px">Untitled.txt</span><span style="flex:1"></span><span class="muted" id="savestate">Saved</span></div><div class="editarea"><div class="linenums" id="lines">1</div><textarea id="note" spellcheck="false" placeholder="Start typing..."></textarea></div><div class="estatus" id="editstatus">Ln 1, Col 1 · UTF-8 · Plain text</div></div>';
if(id==='settings')return '<div class="settings"><aside class="snav"><button class="on" data-tab="appearance">◐ Appearance</button><button data-tab="system">⚙ System</button><button data-tab="network">◎ Network</button></aside><section class="smain" id="smain"></section></div>';
if(id==='system')return '<div class="pad"><div class="eyebrow">PERFORMANCE OVERVIEW</div><h2>System monitor</h2><div class="sysgrid"><div class="panel">MEMORY ESTIMATE<div class="metric" id="mem">--%</div><div class="meter"><span id="mbar"></span></div><small class="muted">Browser-reported JS heap when available</small></div><div class="panel">SESSION UPTIME<div class="metric" id="up">00:00:00</div></div><div class="panel">OPEN WINDOWS<div class="metric" id="wc">0</div></div><div class="panel">PLATFORM<div class="metric" id="plat" style="font-size:17px">Web</div></div></div><div class="panel" style="margin-top:12px"><b>Runtime details</b><p id="details" class="muted" style="font:11px/2 DM Mono"></p></div></div>';
if(id==='viewer')return '<div class="viewer"><img id="viewimg" src="'+esc(arg||'')+'" alt="Image"><span id="viewerr" class="muted" style="display:none">Image could not be loaded.</span></div>';return '<div class="pad">App unavailable.</div>'}
function open(id,arg){if(!apps[id])return;let old=Object.values(wins).find(w=>w.id===id);if(old){if(old.min)restore(old.key);focus(old.key);if(id==='viewer'&&arg)old.el.querySelector('#viewimg').src=arg;return}let key='w'+Date.now()+Math.random().toString(16).slice(2,5),a=apps[id],el=document.createElement('section');el.className='win';el.dataset.key=key;el.style.width=Math.min(a[2],innerWidth-20)+'px';el.style.height=Math.min(a[3],innerHeight-110)+'px';el.style.left=Math.max(8,(innerWidth-a[2])/2+(Object.keys(wins).length%4)*22)+'px';el.style.top=Math.max(40,(innerHeight-a[3])/2+(Object.keys(wins).length%4)*18)+'px';el.innerHTML='<header class="titlebar"><div class="traffic"><button class="close" data-act="close"></button><button class="min" data-act="min"></button><button class="max" data-act="max"></button></div><span style="margin-right:8px">'+a[0]+'</span><span class="wtitle">'+a[1]+'</span><button class="action" data-act="min">—</button><button class="action" data-act="max">□</button></header><div class="wbody">'+content(id,arg)+'</div><div class="resize"></div>';$('#desktop').append(el);wins[key]={key,id,el,min:false,max:false};focus(key);wireWindow(key);wireApp(id,el,arg);dock()}
function focus(k){let w=wins[k];if(!w)return;Object.values(wins).forEach(x=>x.el.classList.remove('focus'));w.el.classList.add('focus');w.el.style.zIndex=++z;active=k;dock()}
function close(k){let w=wins[k];if(!w||w.closing||w.minimizing)return;w.closing=true;w.el.classList.remove('is-restoring');w.el.classList.add('is-closing');w.el.onanimationend=e=>{if(e.target!==w.el||e.animationName!=='win-close')return;w.el.remove();delete wins[k];if(active===k)active=null;let next=Object.values(wins).filter(x=>!x.min&&!x.closing).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(next)focus(next.key);dock()}}
function minimize(k){let w=wins[k];if(!w||w.min||w.minimizing||w.closing)return;w.minimizing=true;w.el.classList.remove('is-restoring');w.el.classList.add('is-minimizing');w.el.onanimationend=e=>{if(e.target!==w.el||e.animationName!=='win-minimize')return;w.el.style.display='none';w.el.classList.remove('is-minimizing');w.minimizing=false;w.min=true;if(active===k){active=null;let next=Object.values(wins).filter(x=>!x.min&&!x.closing).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(next)focus(next.key)}dock()}}
function restore(k){let w=wins[k];if(!w||w.closing)return;w.el.style.display='flex';w.min=false;w.el.classList.remove('is-minimizing');w.el.classList.add('is-restoring');w.el.onanimationend=e=>{if(e.target===w.el&&e.animationName==='win-restore'){w.el.classList.remove('is-restoring');w.el.onanimationend=null}};focus(k)}
function maximize(k){let w=wins[k];if(!w)return;if(!w.max){w.prev={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};w.el.classList.add('max');w.max=true}else{w.el.classList.remove('max');Object.assign(w.el.style,w.prev);w.max=false}focus(k)}
function wireWindow(k){let w=wins[k],el=w.el,bar=el.querySelector('.titlebar'),drag=null;el.addEventListener('pointerdown',()=>focus(k));bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.max)return;focus(k);drag={x:e.clientX-parseFloat(el.style.left),y:e.clientY-parseFloat(el.style.top)};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(drag){el.style.left=Math.max(0,Math.min(innerWidth-100,e.clientX-drag.x))+'px';el.style.top=Math.max(34,Math.min(innerHeight-90,e.clientY-drag.y))+'px'}});bar.addEventListener('pointerup',()=>drag=null);el.querySelector('.resize').addEventListener('pointerdown',e=>{if(w.max)return;e.stopPropagation();let x=e.clientX,y=e.clientY,ww=el.offsetWidth,hh=el.offsetHeight,move=v=>{el.style.width=Math.max(300,ww+v.clientX-x)+'px';el.style.height=Math.max(210,hh+v.clientY-y)+'px'},up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up)};addEventListener('pointermove',move);addEventListener('pointerup',up)});el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>({close:()=>close(k),min:()=>minimize(k),max:()=>maximize(k)}[b.dataset.act]()))}
function dock(){let d=$('#dockApps');d.innerHTML='';Object.values(wins).forEach(w=>{let b=document.createElement('button');b.textContent=apps[w.id][0];b.title=apps[w.id][1];b.className=w.key===active?'active':'';b.onclick=()=>w.min?restore(w.key):w.key===active?minimize(w.key):focus(w.key);d.append(b)})}
function wireApp(id,el,arg){if(id==='browser')browser(el);if(id==='terminal')terminal(el);if(id==='explorer')explorer(el);if(id==='editor')editor(el,arg);if(id==='settings')settings(el);if(id==='system')system(el);if(id==='viewer')el.querySelector('#viewimg').onerror=()=>el.querySelector('#viewerr').style.display='block'}
function browser(el){let addr=el.querySelector('#addr'),body=el.querySelector('#bbody'),note=el.querySelector('#bnote'),hist=[],idx=-1;function go(raw){let u=raw.trim();if(!u)return;if(!/^https?:\/\//i.test(u)){u=u.includes('.')&&!u.includes(' ')?'https://'+u:'https://www.google.com/search?q='+encodeURIComponent(u)}addr.value=u;hist=hist.slice(0,idx+1);hist.push(u);idx++;note.textContent='Fetching through proxy…';body.innerHTML='<div class="pad"><span class="eyebrow">LOADING</span><p>'+esc(u)+'</p></div>';let p=cfg.proxy||defaults.proxy,target=p.includes('{url}')?p.replace('{url}',p.startsWith('https://proxy.cors.dev/')?u:encodeURIComponent(u)):p+encodeURIComponent(u);fetch(target).then(r=>{if(!r.ok)throw Error('Proxy returned HTTP '+r.status);return r.text()}).then(html=>{let doc=new DOMParser().parseFromString(html,'text/html'),base=doc.querySelector('base')||doc.createElement('base');base.href=u;doc.head.prepend(base);let frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox');frame.style.cssText='width:100%;height:100%;min-height:450px;border:0;background:white';frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;body.innerHTML='';body.append(frame);note.textContent='Loaded via proxy · '+new URL(u).hostname+' · sandboxed preview'}).catch(err=>{body.innerHTML='<div class="pad"><span class="eyebrow">COULD NOT LOAD</span><h2>Proxy request failed</h2><p>'+esc(err.message)+'</p><p class="muted">Try another endpoint in Settings → Network, or open the original site in a new tab.</p><button class="btn" id="external">Open original site ↗</button></div>';body.querySelector('#external').onclick=()=>window.open(u,'_blank','noopener');note.textContent='Proxy error'})}el.querySelector('#go').onclick=()=>go(addr.value);addr.onkeydown=e=>{if(e.key==='Enter')go(addr.value)};el.querySelector('#bsearchgo').onclick=()=>go(el.querySelector('#bsearch').value);el.querySelector('#bsearch').onkeydown=e=>{if(e.key==='Enter')go(e.target.value)};el.querySelectorAll('.quick').forEach(b=>b.onclick=()=>go(b.dataset.url));el.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;if(n==='reload'&&idx>=0)go(hist[idx]);if(n==='back'&&idx>0){idx-=2;go(hist[idx+1])}if(n==='forward'&&idx<hist.length-1)go(hist[idx+1])})}
function terminal(el){let out=el.querySelector('#tout'),inp=el.querySelector('#tin'),print=s=>{out.innerHTML+=s+'<br>';out.scrollTop=out.scrollHeight};function run(cmd){let a=cmd.trim().split(/\s+/),c=a[0],v=a.slice(1).join(' ');if(!c)return;if(c==='help')print('help  ls  cat [file]  clear  date  whoami  matrix  neofetch  proxy [url]');else if(c==='clear')out.innerHTML='';else if(c==='date')print(new Date().toString());else if(c==='whoami')print('guest · NOVA workspace');else if(c==='ls')print((fs[folder]||[]).map(f=>f.name+(f.type==='folder'?'/':'')).join('    ')||'(empty)');else if(c==='cat'){let f=(fs[folder]||[]).find(x=>x.name===v)||Object.values(fs).flat().find(x=>x.name===v);print(f&&f.type==='text'?esc(f.content).replace(/\n/g,'<br>'):'cat: file not found')}else if(c==='proxy')print('Proxy endpoint: '+esc(cfg.proxy)+' (change in Settings → Network)');else if(c==='neofetch')print('<span style="color:var(--a)">ＮＯＶＡ　ＯＳ</span><br>OS: NOVA Web Desktop<br>Kernel: Browser Runtime<br>Shell: nova-shell 1.0<br>Viewport: '+innerWidth+'×'+innerHeight);else if(c==='matrix')print('<span style="color:#4de69a">'+Array.from({length:5},()=>Array.from({length:48},()=>Math.random()<.5?'0':'1').join('')).join('<br>')+'</span>');else print('command not found: '+esc(c))}inp.onkeydown=e=>{if(e.key==='Enter'){let v=inp.value;print('<span style="color:var(--a)">guest@nova:~$</span> '+esc(v));run(v);inp.value=''}}}
function explorer(el){let list=el.querySelector('#filelist');function draw(){el.querySelector('#path').textContent=folder;list.innerHTML='';(fs[folder]||[]).forEach(f=>{let b=document.createElement('button');b.className='file';b.innerHTML='<span>'+f.icon+'</span>'+esc(f.name)+'<small>'+f.type+'</small>';b.ondblclick=()=>{if(f.type==='folder'){folder=f.path;draw()}else if(f.type==='text')open('editor',f);else if(f.type==='image')open('viewer',f.url)};list.append(b)})}el.querySelector('#backfolder').onclick=()=>{folder='/root';draw()};el.querySelector('#homefolder').onclick=()=>{folder='/root';draw()};el.querySelector('#newfile').onclick=()=>{let n=prompt('Name your new text file','New file.txt');if(n){(fs[folder]||=[]).push({name:n,type:'text',icon:'📄',content:''});save();draw()}};draw()}
function editor(el,arg){let ta=el.querySelector('#note'),lines=el.querySelector('#lines');function line(){lines.textContent=Array.from({length:Math.max(1,ta.value.split('\n').length)},(_,i)=>i+1).join('\n')}function load(n,c){noteName=n;ta.value=c||'';el.querySelector('#notename').textContent=n;el.querySelector('#savestate').textContent='Saved';dirty=false;line()}if(arg&&arg.type==='text')load(arg.name,arg.content);else load('Untitled.txt','');ta.oninput=()=>{dirty=true;el.querySelector('#savestate').textContent='Unsaved';line()};ta.onscroll=()=>{lines.scrollTop=ta.scrollTop};ta.onkeyup=()=>{let a=ta.value.slice(0,ta.selectionStart).split('\n');el.querySelector('#editstatus').textContent='Ln '+a.length+', Col '+(a[a.length-1].length+1)+' · UTF-8 · Plain text'};el.querySelector('#newnote').onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;load('Untitled.txt','')};el.querySelector('#savenote').onclick=()=>{let f=Object.values(fs).flat().find(x=>x.name===noteName&&x.type==='text');if(!f){let n=prompt('Save file as','Note.txt');if(!n)return;noteName=n;(fs['/documents']||=[]).push({name:n,type:'text',icon:'📄',content:ta.value})}else f.content=ta.value;save();el.querySelector('#notename').textContent=noteName;el.querySelector('#savestate').textContent='Saved';dirty=false;toast('File saved locally')}}
function settings(el){let main=el.querySelector('#smain');function show(tab){el.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='appearance')main.innerHTML='<div class="eyebrow">PERSONALIZATION</div><h2>Appearance</h2><p class="muted">Make this workspace feel like yours.</p><h4>Accent color</h4><div class="swatches">'+['#8b7cff','#42c9b5','#ef7197','#e4ad57','#5ba6ed','#e6e9f3'].map(c=>'<button class="swatch" data-color="'+c+'" style="background:'+c+'"></button>').join('')+'</div><h4 style="margin-top:22px">Desktop wallpaper</h4><div class="wallgrid">'+walls.map((w,i)=>'<button class="wallchoice '+(cfg.wall===i?'on':'')+'" data-wall="'+i+'" style="background:'+w+'"></button>').join('')+'</div>';if(tab==='system')main.innerHTML='<div class="eyebrow">PREFERENCES</div><h2>System</h2><label class="muted">Interface scale · <span id="scalev">'+cfg.scale.toFixed(1)+'×</span></label><input id="scale" type="range" min=".8" max="1.2" step=".1" value="'+cfg.scale+'" style="display:block;width:100%;accent-color:var(--a);margin:12px 0 22px"><p class="muted">Audio feedback</p><button class="ghost" id="audio">'+(cfg.audio?'◉ Enabled':'○ Disabled')+'</button><p class="muted" style="font-size:10px;margin-top:20px">Preferences are stored in this browser using localStorage.</p>';if(tab==='network')main.innerHTML='<div class="eyebrow">CONNECTIVITY</div><h2>Network & Proxy</h2><p class="muted">Set the endpoint used by NOVA Browser to fetch pages.</p><label class="muted">Proxy URL template</label><input class="field" id="proxy" value="'+esc(cfg.proxy)+'" style="margin:8px 0"><p class="muted" style="font-size:10px;line-height:1.6">Use an endpoint that accepts a target URL as a query parameter. Include {url} where the encoded destination belongs, or the destination is appended. Public proxies can be unreliable. A proxy cannot defeat every site restriction, login flow, or browser security policy.</p><button class="btn" id="saveproxy">Save proxy</button> <button class="ghost" id="resetproxy">Restore default</button>';main.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{cfg.accent=b.dataset.color;apply();save()});main.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{cfg.wall=+b.dataset.wall;apply();save();show('appearance')});let sc=main.querySelector('#scale');if(sc)sc.oninput=()=>{cfg.scale=+sc.value;main.querySelector('#scalev').textContent=cfg.scale.toFixed(1)+'×';apply();save()};let au=main.querySelector('#audio');if(au)au.onclick=()=>{cfg.audio=!cfg.audio;au.textContent=cfg.audio?'◉ Enabled':'○ Disabled';save()};let sp=main.querySelector('#saveproxy');if(sp)sp.onclick=()=>{let v=main.querySelector('#proxy').value.trim();if(!v)return toast('Enter a proxy endpoint');cfg.proxy=v;save();toast('Proxy endpoint saved')};let rp=main.querySelector('#resetproxy');if(rp)rp.onclick=()=>{cfg.proxy=defaults.proxy;save();show('network');toast('Default proxy restored')}}el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('appearance')}
function system(el){function tick(){if(!el.isConnected)return;let m=performance.memory?Math.round(performance.memory.usedJSHeapSize/performance.memory.jsHeapSizeLimit*100):Math.round(24+Math.random()*8),s=Math.floor((Date.now()-started)/1000);el.querySelector('#mem').textContent=m+'%';el.querySelector('#mbar').style.width=m+'%';el.querySelector('#up').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');el.querySelector('#wc').textContent=Object.keys(wins).length;el.querySelector('#plat').textContent=navigator.platform||'Web';el.querySelector('#details').textContent='Viewport: '+innerWidth+' × '+innerHeight+'\\nLanguage: '+navigator.language+'\\nStorage: localStorage · '+(navigator.onLine?'online':'offline')}tick();let t=setInterval(()=>{if(!el.isConnected)clearInterval(t);else tick()},1500)}
/* Launcher + desktop */
function launcher(filter){let grid=$('#launchGrid');grid.innerHTML=Object.keys(apps).filter(id=>(id+' '+apps[id][1]).toLowerCase().includes(filter.toLowerCase())).map(id=>'<button data-launch="'+id+'"><span>'+apps[id][0]+'</span>'+apps[id][1]+'</button>').join('');grid.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>{$('#launcher').classList.remove('open');open(b.dataset.launch)})}launcher('');$('#launchSearch').oninput=e=>launcher(e.target.value);$('#start').onclick=()=>$('#launcher').classList.toggle('open');$('#topMenu').onclick=()=>$('#launcher').classList.toggle('open');document.addEventListener('pointerdown',e=>{if(!e.target.closest('#launcher,#start,#topMenu'))$('#launcher').classList.remove('open')});
$('#icons').addEventListener('click',e=>{let b=e.target.closest('[data-app]');if(!b)return;all('.deskicon').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');open(b.dataset.app)});$('#dock').addEventListener('click',e=>{let b=e.target.closest('[data-app]');if(b)open(b.dataset.app)});
let selecting=null;$('#desktop').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.win,#dockwrap,#top,#launcher,.deskicon'))return;selecting={x:e.clientX,y:e.clientY};let b=$('#selectbox');b.style.display='block';b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';b.style.width='0';b.style.height='0'});document.addEventListener('pointermove',e=>{if(!selecting)return;let b=$('#selectbox');b.style.left=Math.min(selecting.x,e.clientX)+'px';b.style.top=Math.min(selecting.y,e.clientY)+'px';b.style.width=Math.abs(selecting.x-e.clientX)+'px';b.style.height=Math.abs(selecting.y-e.clientY)+'px'});document.addEventListener('pointerup',e=>{if(!selecting)return;let x1=Math.min(selecting.x,e.clientX),x2=Math.max(selecting.x,e.clientX),y1=Math.min(selecting.y,e.clientY),y2=Math.max(selecting.y,e.clientY);all('.deskicon').forEach(b=>{let r=b.getBoundingClientRect();if(r.left<x2&&r.right>x1&&r.top<y2&&r.bottom>y1)b.classList.add('sel')});selecting=null;$('#selectbox').style.display='none'});
$('#desktop').addEventListener('contextmenu',e=>{if(e.target.closest('.win'))return;e.preventDefault();let c=$('#ctx');c.innerHTML='<button data-c="refresh">↻ Refresh desktop</button><button data-c="wall">◐ Change background</button><button data-c="settings">⚙ Open settings</button><button data-c="system">⌘ System information</button>';c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-195)+'px';c.style.top=Math.min(e.clientY,innerHeight-150)+'px'});document.addEventListener('click',e=>{if(!e.target.closest('#ctx'))$('#ctx').style.display='none'});$('#ctx').onclick=e=>{let c=e.target.closest('[data-c]')?.dataset.c;if(c==='refresh'){all('.deskicon').forEach(b=>b.classList.remove('sel'));toast('Desktop refreshed')}if(c==='wall'){cfg.wall=(cfg.wall+1)%walls.length;apply();save()}if(c==='settings'||c==='system')open(c)};
function updateClocks(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#net').textContent=navigator.onLine?'◉ Connected':'○ Offline'}updateClocks();setInterval(updateClocks,1000);addEventListener('online',tick);addEventListener('offline',tick);addEventListener('resize',()=>Object.values(wins).forEach(w=>{if(!w.max){w.el.style.left=Math.min(parseFloat(w.el.style.left),innerWidth-w.el.offsetWidth)+'px';w.el.style.top=Math.min(parseFloat(w.el.style.top),innerHeight-90)+'px'}}));addEventListener('keydown',e=>{if(e.key==='Escape'){$('#ctx').style.display='none';$('#launcher').classList.remove('open')}if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();$('#launcher').classList.toggle('open');$('#launchSearch').focus()}});setTimeout(()=>toast('Welcome to NOVA OS · Click an icon to launch'),500);
